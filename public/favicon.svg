<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- CSS Animation Styles -->
    <style>
      @keyframes pulsate {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.06); opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
      }
      .aura-pulse {
        transform-origin: 250px 220px; /* Center of the aura */
        animation: pulsate 4s ease-in-out infinite;
      }
    </style>

    <!-- Subtle gradient for the aura -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#9bb6ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c3d5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background and Borders -->
  <circle cx="250" cy="250" r="230" fill="#fdfaf3" stroke="#e6dbcb" stroke-width="12"/>
  <circle cx="250" cy="250" r="210" fill="none" stroke="#e6dbcb" stroke-width="4" stroke-dasharray="12 8"/>

  <!-- Ethereal Blue Aura (Animated) -->
  <g class="aura-pulse">
    <circle cx="250" cy="220" r="130" fill="url(#auraGlow)"/>
    <path d="M 150 250 C 120 180, 180 100, 250 90 C 320 100, 380 180, 350 250 C 370 320, 300 350, 250 350 C 200 350, 130 320, 150 250 Z" fill="#c3d5ff" opacity="0.5"/>
    <path d="M 180 230 C 160 170, 200 120, 250 110 C 300 120, 340 170, 320 230 C 330 280, 280 320, 250 320 C 220 320, 170 280, 180 230 Z" fill="#9bb6ff" opacity="0.6"/>
  </g>

  <!-- Cloak/Cape -->
  <path d="M 170 280 Q 150 380 160 420 L 340 420 Q 350 380 330 280 Z" fill="#295c53"/>
  <path d="M 190 280 Q 180 380 200 410 L 300 410 Q 320 380 310 280 Z" fill="#1f453e"/>

  <!-- Tunic/Body -->
  <rect x="205" y="270" width="90" height="120" rx="20" fill="#7a6249"/>
  <!-- Belt -->
  <rect x="203" y="360" width="94" height="12" fill="#4a3b2b" rx="2"/>

  <!-- Head Base -->
  <circle cx="250" cy="210" r="70" fill="#ffdcb8"/>
  
  <!-- Ears -->
  <circle cx="180" cy="220" r="16" fill="#f0cba5"/>
  <circle cx="320" cy="220" r="16" fill="#f0cba5"/>

  <!-- Hair Base -->
  <path d="M 175 200 C 175 130, 220 120, 250 125 C 280 120, 325 130, 325 200 C 330 240, 310 255, 310 255 C 310 255, 320 190, 290 160 C 270 140, 230 140, 210 160 C 180 190, 190 255, 190 255 C 190 255, 170 240, 175 200 Z" fill="#423326"/>
  <!-- Hair Bangs -->
  <path d="M 190 180 Q 220 145 250 180 Q 230 160 190 180 Z" fill="#36291e"/>
  <path d="M 310 180 Q 280 145 250 180 Q 270 160 310 180 Z" fill="#36291e"/>

  <!-- Crown (Grandeur) -->
  <path d="M 210 155 L 225 100 L 250 135 L 275 100 L 290 155 Z" fill="#f1c40f" stroke="#b8950b" stroke-width="4" stroke-linejoin="round"/>
  <!-- Crown Jewels -->
  <circle cx="225" cy="100" r="6" fill="#f39c12"/>
  <circle cx="250" cy="135" r="6" fill="#f39c12"/>
  <circle cx="275" cy="100" r="6" fill="#f39c12"/>

  <!-- Face Details -->
  <!-- Eyes -->
  <circle cx="220" cy="215" r="12" fill="#2d2218"/>
  <circle cx="280" cy="215" r="12" fill="#2d2218"/>
  <!-- Eye Highlights -->
  <circle cx="216" cy="211" r="4" fill="#ffffff"/>
  <circle cx="276" cy="211" r="4" fill="#ffffff"/>
  <circle cx="223" cy="218" r="2" fill="#ffffff"/>
  <circle cx="283" cy="218" r="2" fill="#ffffff"/>
  
  <!-- Mouth -->
  <path d="M 242 240 Q 250 250 258 240" stroke="#2d2218" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Cheeks -->
  <ellipse cx="205" cy="230" rx="9" ry="5" fill="#ffb6b6" opacity="0.7"/>
  <ellipse cx="295" cy="230" rx="9" ry="5" fill="#ffb6b6" opacity="0.7"/>

  <!-- Plant Sprout and Glow (Humbleness) -->
  <!-- Magic Glow Behind Plant -->
  <circle cx="250" cy="305" r="30" fill="#f4d03f" opacity="0.2"/>
  <circle cx="250" cy="305" r="15" fill="#f4d03f" opacity="0.4"/>
  
  <!-- Sprout stem -->
  <path d="M 250 330 L 250 300" stroke="#7cb342" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Leaves -->
  <path d="M 250 325 Q 230 300 220 310 Q 240 325 250 325 Z" fill="#8bc34a"/>
  <path d="M 250 315 Q 270 290 280 300 Q 260 315 250 315 Z" fill="#8bc34a"/>
  <path d="M 250 300 Q 240 285 245 275 Q 260 285 250 300 Z" fill="#cddc39"/>

  <!-- Hands -->
  <circle cx="235" cy="335" r="15" fill="#ffdcb8"/>
  <circle cx="265" cy="335" r="15" fill="#ffdcb8"/>

  <!-- Decorative Sparkles -->
  <path d="M 140 180 L 145 165 L 150 180 L 135 175 L 155 175 Z" fill="#ffffff" opacity="0.7"/>
  <path d="M 360 150 L 365 140 L 370 150 L 355 145 L 375 145 Z" fill="#ffffff" opacity="0.7"/>
  <circle cx="120" cy="250" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="380" cy="230" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="170" cy="120" r="5" fill="#ffffff" opacity="0.6"/>
</svg>
